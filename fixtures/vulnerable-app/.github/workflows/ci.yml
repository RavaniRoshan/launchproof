name: ci
on:
  pull_request_target:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: echo "${{ github.event.pull_request.title }}"
      - run: npm test
